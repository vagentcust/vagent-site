<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-AGENT — Вход</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050508;
            --card: rgba(23, 27, 34, 0.6);
            --ink: #ECEFF4;
            --mute: #8B94A3;
            --line: rgba(255, 255, 255, 0.12);
            --accent: #8794FF;
            --nav-bg: rgba(10, 10, 15, 0.85);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            overflow-x: hidden;
            width: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: "Onest", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            padding-bottom: 10px;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
            background-color: #050508;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(30, 40, 90, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(60, 15, 70, 0.3) 0%, transparent 50%);
            background-repeat: no-repeat;
            background-size: cover;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .bg-glow.loaded { opacity: 1; }

        .loader-screen {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            transition: opacity 0.6s ease;
        }
        .loader-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ЛОГО НА ЭКРАНЕ ЗАГРУЗКИ (400px) */
        .loader-logo {
            width: 400px;
            max-width: 90vw;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.02); opacity: 1; }
        }
        .loader-bar-container {
            width: 260px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .loader-bar {
            width: 0%;
            height: 100%;
            background: #FFFFFF;
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        /* ПАНЕЛЬ (1000px) */
        .nav {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 1000px;
            z-index: 10000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 0 24px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .nav-left { display: flex; align-items: center; }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--ink);
            transition: opacity 0.3s;
        }
        .nav-logo:hover { opacity: 0.8; }

        /* ЛОГО В ПАНЕЛИ (50px) */
        .nav-logo img.nav-icon {
            height: 50px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .nav-link {
            position: relative;
            color: var(--mute);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-family: "Onest", sans-serif;
            white-space: nowrap;
            padding: 8px 4px;
        }
        .nav-link:hover {
            color: var(--ink);
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
        }

        .bell-wrapper { position: relative; }
        .nav-bell {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .nav-bell:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .nav-bell svg {
            width: 18px;
            height: 18px;
            stroke: var(--ink);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .bell-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background: #FF3B30;
            border-radius: 50%;
            border: 2px solid var(--bg);
            display: none;
        }
        .bell-badge.show { display: block; }

        .notif-dropdown {
            display: none;
            position: absolute;
            top: 48px;
            right: 0;
            width: 320px;
            max-width: calc(100vw - 40px);
            background: var(--card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            padding: 15px;
            z-index: 50;
            flex-direction: column;
            gap: 10px;
        }
        .notif-dropdown.show { display: flex; }
        .notif-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }
        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        .notif-item {
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-size: 13px;
            color: var(--mute);
            line-height: 1.4;
        }
        .notif-item.error { border-left: 3px solid #FF3B30; color: #FF8A80; }
        .notif-item.success { border-left: 3px solid #4CAF50; color: #81C784; }

        .glass-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            margin-top: 40px;
            animation: appear 0.8s cubic-bezier(.2,.7,.2,1) both;
            display: flex;
            justify-content: center;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .glass-container.loaded { opacity: 1; }

        @keyframes appear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glass-card {
            width: 100%;
            background: rgba(23, 27, 34, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 30px 30px 40px 30px;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-block {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 20px;
        }

        /* ЛОГО НАД ФОРМОЙ (300px) */
        .logo-img {
            width: 300px;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(135, 148, 255, 0.4));
        }

        .input-group { width: 100%; margin-bottom: 14px; position: relative; }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.7;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, 0.3);
            color: var(--ink);
            font-size: 15px;
            font-family: "Onest", sans-serif;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(135, 148, 255, 0.2);
        }

        .hidden { display: none !important; }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: "Onest", sans-serif;
            text-align: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #6A7AFF);
            color: #fff;
            box-shadow: 0 8px 25px rgba(135, 148, 255, 0.4);
            margin-top: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(135, 148, 255, 0.6);
        }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-link {
            background: none;
            color: var(--mute);
            font-size: 13px;
            margin-top: 18px;
            padding: 5px;
        }
        .btn-link:hover { color: var(--ink); }

        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--bg); padding: 30px; border-radius: 20px;
            border: 1px solid var(--line); max-width: 500px; width: 90%;
            position: relative; max-height: 80vh; overflow-y: auto;
        }
        .modal-close {
            position: absolute; top: 15px; right: 15px;
            background: none; border: none; color: var(--mute); font-size: 24px; cursor: pointer;
        }
        .modal-content h3 { font-size: 16px; color: var(--accent); margin: 15px 0 5px; }
        .modal-content p { color: var(--mute); font-size: 14px; line-height: 1.5; margin-bottom: 10px; }

        @media (max-width: 850px) {
            .nav { top: 10px; width: calc(100% - 20px); height: 52px; padding: 0 14px; border-radius: 16px; }
            .nav-logo img.nav-icon { height: 32px; }
            .nav-link[href*="#download"] { display: none; }
            .nav-right { gap: 10px; }
            .nav-link { font-size: 12px; padding: 6px 2px; }
            .nav-bell { width: 32px; height: 32px; }
            .nav-bell svg { width: 16px; height: 16px; }
            .bell-badge { width: 8px; height: 8px; top: 2px; right: 2px; border-width: 1.5px; }
            .notif-dropdown { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); width: calc(100vw - 30px); max-width: 340px; }

            .glass-container { margin-top: 50px; padding: 10px; max-height: calc(100vh - 60px); }
            .glass-card { padding: 25px 20px 30px 20px; border-radius: 24px; box-shadow: none; }
            .logo-img { width: 260px; margin-bottom: 15px; }
            .input-group { margin-bottom: 12px; }
            .input-group input { padding: 13px 14px 13px 42px; font-size: 14px; }
            .input-icon { left: 14px; width: 18px; height: 18px; }
            .btn { padding: 13px; font-size: 14px; }
            .btn-link { margin-top: 14px; font-size: 12px; }

            .loader-logo { width: 260px; }
            .loader-bar-container { width: 180px; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div class="loader-screen" id="loader">
        <img src="img.png" alt="V-AGENT" class="loader-logo">
        <div class="loader-bar-container">
            <div class="loader-bar" id="loader-bar"></div>
        </div>
    </div>

    <div class="bg-glow" id="bg-glow"></div>

    <!-- ПАНЕЛЬ -->
    <nav class="nav">
        <div class="nav-left">
            <a href="index.html" class="nav-logo">
                <img src="logo_text.png" alt="V-AGENT" class="nav-icon">
            </a>
        </div>
        <div class="nav-right">
            <a href="index.html#download" class="nav-link">Скачать</a>
            <button class="nav-link" onclick="openModal('privacy')">Безопасность</button>

            <div class="bell-wrapper">
                <button class="nav-bell" id="bell-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <div class="bell-badge" id="bell-badge"></div>
                </button>

                <div class="notif-dropdown" id="notif-menu">
                    <div class="notif-header">Уведомления</div>
                    <div class="notif-list" id="notif-list">
                        <div class="notif-item">Добро пожаловать в V-AGENT!</div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ФОРМА ВХОДА -->
    <div class="glass-container" id="main-form">
        <div class="glass-card">
            <div class="logo-block">
                <img src="logo_text.png" alt="V-AGENT" class="logo-img">
            </div>

            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="username" placeholder="Логин" autocomplete="username">
            </div>

            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
            </div>

            <div class="input-group hidden" id="confirm-group">
                <svg class="input-icon" viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <input type="password" id="confirm-password" placeholder="Подтверди пароль" autocomplete="new-password">
            </div>

            <button id="submit-btn" class="btn btn-primary">Войти</button>
            <button id="switch-btn" class="btn btn-link">Нет аккаунта? Зарегистрироваться</button>
        </div>
    </div>

    <div id="info-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2 id="modal-title" style="margin-bottom: 15px; font-family: 'Unbounded';">Заголовок</h2>
            <div id="modal-text" style="color: var(--mute); line-height: 1.6; font-size: 14px;"></div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const bar = document.getElementById('loader-bar');
            const loader = document.getElementById('loader');
            const form = document.getElementById('main-form');
            const bg = document.getElementById('bg-glow');

            let progress = 0;
            const interval = setInterval(() => {
                progress += 2;
                bar.style.width = Math.min(progress, 100) + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loader.classList.add('hidden');
                        form.classList.add('loaded');
                        bg.classList.add('loaded');
                    }, 300);
                }
            }, 50);
        });

        if (localStorage.getItem('vagent_user')) { location.replace('./app.html'); }

        const bellBtn = document.getElementById('bell-btn');
        const notifMenu = document.getElementById('notif-menu');
        const notifList = document.getElementById('notif-list');
        const bellBadge = document.getElementById('bell-badge');

        function addNotification(text, type = 'info') {
            const item = document.createElement('div');
            item.className = 'notif-item ' + type;
            item.textContent = text;
            notifList.prepend(item);
            bellBadge.classList.add('show');
            notifMenu.classList.add('show');
        }

        bellBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            notifMenu.classList.toggle('show');
            if (notifMenu.classList.contains('show')) {
                bellBadge.classList.remove('show');
            }
        });

        document.addEventListener('click', (e) => {
            if (!notifMenu.contains(e.target) && e.target !== bellBtn) {
                notifMenu.classList.remove('show');
            }
        });

        const modal = document.getElementById('info-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');

        function openModal(type) {
            modal.style.display = 'flex';
            if (type === 'privacy') {
                modalTitle.textContent = 'Конфиденциальность и Безопасность';
                modalText.innerHTML = `
                    <p>Мы серьезно относимся к защите ваших данных. Вот как именно мы обеспечиваем безопасность ваших паролей:</p>
                    <h3>1. Никакого хранения в открытом виде</h3>
                    <p>Мы <b>никогда</b> не сохраняем ваш пароль в виде обычного текста.</p>
                    <h3>2. Хеширование (SHA-256 и соль)</h3>
                    <p>Ваш пароль превращается в уникальный набор символов с помощью алгоритма <b>SHA-256</b>.</p>
                    <h3>3. Где хранятся данные?</h3>
                    <p>Данные хранятся в защищенном облаке Cloudflare (Workers KV).</p>
                `;
            }
        }

        function closeModal() { modal.style.display = 'none'; }
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        let isLoginMode = true;
        const submitBtn = document.getElementById('submit-btn');
        const switchBtn = document.getElementById('switch-btn');
        const confirmGroup = document.getElementById('confirm-group');

        switchBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                submitBtn.textContent = "Войти";
                switchBtn.textContent = "Нет аккаунта? Зарегистрироваться";
                confirmGroup.classList.add('hidden');
            } else {
                submitBtn.textContent = "Создать аккаунт";
                switchBtn.textContent = "Уже есть аккаунт? Войти";
                confirmGroup.classList.remove('hidden');
            }
        });

        submitBtn.addEventListener('click', async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const confirmPass = document.getElementById('confirm-password').value.trim();

            if (!user || !pass) {
                addNotification("Заполни логин и пароль", "error");
                return;
            }

            if (!isLoginMode) {
                if (pass !== confirmPass) {
                    addNotification("Пароли не совпадают", "error");
                    return;
                }
                if (pass.length < 4) {
                    addNotification("Пароль должен быть не короче 4 символов", "error");
                    return;
                }
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Загрузка...";

            const url = isLoginMode
                ? 'https://vagent-backend.novalaim11.workers.dev/login'
                : 'https://vagent-backend.novalaim11.workers.dev/register';

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('vagent_user', user);
                    addNotification(isLoginMode ? `Успешный вход!` : `Аккаунт создан!`, "success");

                    setTimeout(() => {
                        location.replace('./app.html');
                    }, 1000);

                } else {
                    addNotification(data.error || "Ошибка авторизации", "error");
                }
            } catch (e) {
                addNotification("Нет связи с сервером. Попробуй позже.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? "Войти" : "Создать аккаунт";
            }
        });
    </script>
</body>
</html>
