<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V-AGENT — Вход</title><link rel="icon" href="icon.ico"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050508;--card:rgba(23,27,34,.68);--ink:#eceff4;--mute:#8b94a3;--line:rgba(255,255,255,.12);--accent:#8794ff;--nav:rgba(10,10,15,.86)}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;overflow-x:hidden}body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:95px 14px 24px}.glow{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 0 0,rgba(30,40,90,.4),transparent 50%),radial-gradient(circle at 100% 100%,rgba(60,15,70,.3),transparent 50%)}.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:1000px;height:58px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--nav);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;z-index:5}.nav img{height:38px;max-width:190px;object-fit:contain}.navlinks{display:flex;gap:14px;align-items:center}.nav button{background:none;border:0;color:var(--mute);font:500 13px Onest;cursor:pointer}.nav button:hover{color:white}.card{width:100%;max-width:440px;padding:30px;background:var(--card);backdrop-filter:blur(28px);border:1px solid var(--line);border-radius:26px;box-shadow:0 35px 80px #0009;display:flex;align-items:center;flex-direction:column}.logo{width:min(280px,90%);height:auto;object-fit:contain;margin:0 0 24px;filter:drop-shadow(0 0 25px #8794ff55)}.field{position:relative;width:100%;margin-bottom:13px}.field input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#0005;color:var(--ink);font:15px Onest;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8794ff25}.btn{width:100%;padding:14px;border:0;border-radius:14px;font:600 15px Onest;cursor:pointer}.primary{margin-top:6px;background:linear-gradient(135deg,var(--accent),#6a7aff);color:white;box-shadow:0 8px 25px #8794ff55}.primary:disabled{opacity:.6;cursor:wait}.link{margin-top:13px;background:none;color:var(--mute);font-size:13px}.link:hover{color:white}.notice{position:fixed;right:18px;bottom:18px;max-width:min(360px,calc(100% - 36px));padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:#171b22;color:var(--ink);font-size:13px;display:none;z-index:10}.notice.show{display:block}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{max-width:480px;width:100%;background:#11141b;border:1px solid var(--line);border-radius:18px;padding:25px;line-height:1.6;color:var(--mute)}.modalbox h2{font:600 17px Unbounded;color:var(--ink);margin-bottom:12px}.modalbox button{float:right;background:none;color:white;border:0;font-size:24px}@media(max-width:600px){.nav{height:52px;padding:0 12px;border-radius:15px}.nav img{height:30px}.navlinks{gap:9px}.nav button{font-size:11px}.card{padding:25px 20px}.logo{width:250px}}
</style></head>
<body><div class="glow"></div>
<nav class="nav"><a href="index.html"><img src="logo_text.png" alt="V-AGENT"></a><div class="navlinks"><button onclick="openModal('privacy')">Безопасность</button><button onclick="openModal('rules')">Правила</button></div></nav>
<main class="card"><img class="logo" src="logo_text.png" alt="V-AGENT"><div class="field"><input id="username" type="text" placeholder="Логин (английские буквы и цифры)" autocomplete="username" maxlength="40" pattern="[A-Za-z0-9]{3,40}" autocapitalize="off" spellcheck="false"></div><div class="field"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password" maxlength="256"></div><div class="field" id="confirm-group" hidden><input id="confirm-password" type="password" placeholder="Подтверди пароль" autocomplete="new-password"></div><button id="submit-btn" class="btn primary">Войти</button><button id="switch-btn" class="btn link">Нет аккаунта? Зарегистрироваться</button></main>
<div class="notice" id="notice" role="status"></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button onclick="closeModal()">×</button><h2 id="modal-title"></h2><div id="modal-text"></div></div></div>
<script>
const API='https://vagent-backend.novalaim11.workers.dev';
const $=id=>document.getElementById(id);let isLoginMode=true;let noticeTimer;
function notify(message){const n=$('notice');n.textContent=message;n.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.classList.remove('show'),4500)}
// Старый вход без session_token не перенаправляем: пользователь должен войти заново.
try{if(localStorage.getItem('vagent_user')&&localStorage.getItem('vagent_session_token'))location.replace('./app.html')}catch(e){}
$('switch-btn').addEventListener('click',()=>{isLoginMode=!isLoginMode;$('submit-btn').textContent=isLoginMode?'Войти':'Создать аккаунт';$('switch-btn').textContent=isLoginMode?'Нет аккаунта? Зарегистрироваться':'Уже есть аккаунт? Войти';$('confirm-group').hidden=isLoginMode;$('password').autocomplete=isLoginMode?'current-password':'new-password'});
$('submit-btn').addEventListener('click',async()=>{
 const user=$('username').value.trim(),pass=$('password').value,confirmPass=$('confirm-password').value;
 if(!user||!pass){notify('Заполни логин и пароль');return}
 if(!/^[A-Za-z0-9]{3,40}$/.test(user)){notify('Логин: 3–40 символов, только английские буквы и цифры');return}
 if(!isLoginMode&&!/^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])[\x21-\x7E]{6,256}$/.test(pass)){notify('Пароль: минимум 6 символов, английская буква, цифра и спецзнак (!@#$ и т. п.), без пробелов');return}
 if(!isLoginMode&&(pass!==confirmPass)){notify('Пароли не совпадают');return}
 const btn=$('submit-btn');btn.disabled=true;btn.textContent='Загрузка…';
 try{
  if(!isLoginMode){const rr=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});const rd=await rr.json().catch(()=>({}));if(!rr.ok)throw new Error(rd.error||'Ошибка регистрации')}
  // Получаем серверную сессию и после регистрации, и при обычном входе.
  const res=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Ошибка авторизации');if(!data.session_token)throw new Error('Сервер не вернул токен сессии. Обнови entry.js в Cloudflare Worker.');
  localStorage.setItem('vagent_user',user);localStorage.setItem('vagent_session_token',data.session_token);notify(isLoginMode?'Успешный вход!':'Аккаунт создан!');setTimeout(()=>location.replace('app.html'),350);
 }catch(e){notify(e.message||'Нет связи с сервером. Попробуй позже.')}finally{btn.disabled=false;btn.textContent=isLoginMode?'Войти':'Создать аккаунт'}
});
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('submit-btn').click()});$('username').addEventListener('keydown',e=>{if(e.key==='Enter')$('password').focus()});
function openModal(type){$('modal').classList.add('open');if(type==='privacy'){$('modal-title').textContent='Конфиденциальность и безопасность';$('modal-text').textContent='Пароли не хранятся в открытом виде. Для защиты аккаунта используйте уникальный пароль и не передавайте его другим людям.'}else{$('modal-title').textContent='Правила использования';$('modal-text').textContent='Не используйте сервис для спама, вредоносных действий или публикации материалов, нарушающих права других людей.'}}
function closeModal(){$('modal').classList.remove('open')}
</script></body></html>
