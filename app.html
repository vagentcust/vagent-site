<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<script>document.documentElement.dataset.theme=localStorage.getItem("vagent_theme")||"dark"</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080D">
<title>V-Agent</title>
<link rel="icon" href="icon.ico" type="image/x-icon">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#07080D;--p1:#0D0F17;--p2:#141722;--p3:#1B1F2E;
 --ink:#EEF0F7;--mute:#8A91A6;--dim:#5A6178;
 --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
 --ac:#8794FF;--ac2:#6A7AFF;--vio:#9B6BFF;
 --ok:#6EE7A8;--err:#FF8A8A;--gold:#F2C14E;
 --glass:rgba(13,15,23,.78);--hov:rgba(255,255,255,.05);
 --shadow:0 24px 60px -24px rgba(0,0,0,.8);
 --r:20px;
}
[data-theme=light]{
 --bg:#EFF1F7;--p1:#FFFFFF;--p2:#F6F7FB;--p3:#E9ECF4;
 --ink:#141826;--mute:#5E6679;--dim:#8F96A8;
 --line:rgba(20,24,38,.08);--line2:rgba(20,24,38,.16);
 --ac:#5B6BFF;--ac2:#4757F0;--vio:#7C4DFF;
 --ok:#16915B;--err:#D93A3A;--gold:#B7791F;
 --glass:rgba(255,255,255,.82);--hov:rgba(20,24,38,.05);
 --shadow:0 24px 60px -28px rgba(30,40,90,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 Onest,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{display:block}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(60% 50% at 0% 0%,rgba(106,122,255,.20),transparent 70%),
 radial-gradient(50% 45% at 100% 100%,rgba(155,107,255,.15),transparent 70%)}
[data-theme=light] .aurora{background:
 radial-gradient(60% 50% at 0% 0%,rgba(106,122,255,.18),transparent 70%),
 radial-gradient(50% 45% at 100% 100%,rgba(192,38,211,.08),transparent 70%)}

/* ЭКРАН ЗАГРУЗКИ */
.loader-screen {
    position: fixed; inset: 0; background: #000000; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px;
    transition: opacity 0.6s ease;
}
.loader-screen.hidden { opacity: 0; pointer-events: none; }
.loader-logo { width: 400px; max-width: 90vw; animation: pulse 1.5s ease-in-out infinite alternate; }
@keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.02); opacity: 1; } }
.loader-bar-container { width: 260px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.3); }
.loader-bar { width: 0%; height: 100%; background: #FFFFFF; border-radius: 4px; transition: width 0.1s linear; }

/* shell */
.shell{position:relative;z-index:1;display:flex;height:100dvh}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;width:100%;max-width:880px;margin:0 auto;padding:0 16px}
.scroll{flex:1;min-height:0;overflow:auto;padding:4px 0 28px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* sidebar */
.side{display:none;width:272px;flex:none;flex-direction:column;padding:18px 14px 14px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--line);height:100dvh}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;text-decoration:none;color:var(--ink);font:600 17px Unbounded,sans-serif;cursor:pointer;}
.brand img{width:32px;height:32px;border-radius:10px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.grp{font-size:12px;font-weight:500;color:var(--dim);padding:16px 12px 6px}
.si{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:14px;background:none;color:var(--mute);font-size:14px;font-weight:500;text-align:left;transition:background .15s,color .15s}
.si:hover{background:var(--hov);color:var(--ink)}
.si.on{background:var(--p3);color:var(--ink)}
.si.on:before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ink);animation:grow .3s ease both}
@keyframes grow{from{transform:scaleY(0)}}
.ib{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--ink);background:var(--p3);border:1px solid var(--line);transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .2s}
.si:hover .ib,.qc:hover .ib,.pill:hover .ib{transform:scale(1.08) rotate(-4deg)}
.si .lk{margin-left:auto;color:var(--gold);opacity:.9}
.foot{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.usr{display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;background:var(--p2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;transition:border-color .15s}
.usr:hover{border-color:var(--line2)}
.usr b{display:block;font-size:14px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.usr small{color:var(--mute);font-size:12px}
.ava{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--vio));display:grid;place-items:center;font:600 15px Unbounded,sans-serif;color:#fff;flex:none}
.ibtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--p2);color:var(--mute);display:grid;place-items:center;flex:none;transition:color .15s,border-color .15s}
.ibtn:hover{color:var(--ink);border-color:var(--line2)}
.usr .sp{flex:1;min-width:0}

/* mobile top bar */
.top{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;flex:none}
.top .brand{padding:0;font-size:16px;flex:1}
.top .brand img{width:28px;height:28px;border-radius:9px}
.top .ava{width:34px;height:34px;border-radius:11px;font-size:14px;border:0}

/* tab bar */
.tabs{flex:none;display:flex;gap:4px;padding:8px 10px max(8px,env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line)}
.tb{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;border-radius:16px;background:none;color:var(--mute);font-size:11px;font-weight:500;transition:color .15s}
.tb .pl{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
.tb.on{color:var(--ink)}
.tb.on .pl{background:var(--p3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.tb.on .pl svg{animation:bump .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes bump{0%{transform:scale(.7)}100%{transform:scale(1)}}
.tb .lk{position:absolute;top:3px;left:calc(50% + 10px);width:15px;height:15px;border-radius:8px;background:var(--gold);color:#1A1405;display:grid;place-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:600;font-size:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;text-decoration:none;box-shadow:0 8px 22px -8px var(--ac2);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.g{background:var(--p3);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.w{background:#fff;color:#15183A;box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}

/* home */
.hello{padding:14px 2px 16px}
.hello h1{font:600 26px/1.2 Unbounded,sans-serif;letter-spacing:-.01em}
.hello p{color:var(--mute);margin-top:6px}

/* АНИМИРОВАННЫЙ БАННЕР */
.hero{
    position:relative;overflow:hidden;border-radius:28px;padding:26px;
    background: linear-gradient(135deg, #0E1233, #1A1550, #0B0E22, #0E1233);
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
    border:1px solid rgba(135,148,255,.35);color:#fff;box-shadow:var(--shadow)
}
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.hero h2{font:600 24px/1.2 Unbounded,sans-serif;max-width:420px;margin:0 0 8px; position:relative; z-index:2;}
.hero p{color:rgba(255,255,255,.72);max-width:400px;margin-bottom:18px;font-size:14px; position:relative; z-index:2;}
.hero .pl{position:absolute;right:-14px;bottom:-22px;width:170px;height:170px;opacity:.16;transform:rotate(-14deg); animation: float 6s ease-in-out infinite; z-index:1;}
@keyframes float {
    0% { transform: translateY(0) rotate(-14deg); }
    50% { transform: translateY(-15px) rotate(-4deg); }
    100% { transform: translateY(0) rotate(-14deg); }
}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;position:relative; z-index:2;}
.hero .btn.g{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18); animation: pulseGlow 2s infinite;}
@keyframes pulseGlow {
    0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.2); }
    70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sec h3{font:600 16px Onest,sans-serif}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qc{position:relative;text-align:left;border:1px solid var(--line);border-radius:24px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:
 radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%),var(--p1);transition:transform .18s,border-color .2s}
.qc:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-2px)}
.qc:active{transform:scale(.98)}
.qc .ib{width:46px;height:46px;border-radius:15px;background:var(--hov)}
.qc b{display:block;font-size:17px;font-weight:600}
.qc small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.qc.wide{grid-column:span 2;min-height:120px}
.qc.off{border-style:dashed}
.qc.off .ib{color:var(--mute)}
.qc .go{position:absolute;top:16px;right:16px;color:var(--dim);transition:transform .2s,color .2s}
.qc:hover .go{transform:translate(3px,-3px);color:var(--ink)}

/* chat */
.mh{display:flex;align-items:center;gap:10px;padding:6px 0 10px;flex:none}
.pill{display:flex;align-items:center;gap:11px;padding:5px 14px 5px 5px;border-radius:18px;background:var(--p1);border:1px solid var(--line);text-align:left;color:var(--ink)}
.pill .ib{width:38px;height:38px;border-radius:13px}
.pill b{display:block;font-size:15px;line-height:1.15;font-weight:600}
.pill small{color:var(--mute);font-size:12px}
.pill .cv{color:var(--mute);margin-left:2px}
.box{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:8px 0 10px;scrollbar-width:thin;scrollbar-color:var(--p3) transparent}
.m{display:flex;gap:10px;max-width:100%;animation:pop .22s ease both}
.m.u{justify-content:flex-end}
.m .bd{max-width:min(82%,680px);white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.55}
.m.u .bd{padding:10px 15px;border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,var(--ac2),var(--vio));color:#fff}
.m.a .av{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;color:var(--ink);background:var(--p3);border:1px solid var(--line);margin-top:2px}
.m.a .bd{padding:10px 15px;border-radius:6px 20px 20px 20px;background:var(--p1);border:1px solid var(--line)}
.m.e .bd{border-color:color-mix(in srgb,var(--err) 50%,transparent);color:var(--err)}
.m.a.think .bd{color:var(--mute)}
.bd img{max-width:100%;border-radius:14px;display:block}
.act{display:flex;gap:6px;margin-top:8px}
.act a,.act button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--p2);color:var(--mute);border-radius:10px;padding:5px 10px;font-size:12px;text-decoration:none}
.act a:hover,.act button:hover{color:var(--ink);border-color:var(--line2)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--mute);animation:bl 1.1s infinite both}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.empty{margin:auto;text-align:center;max-width:420px;padding:12px}
.empty>.ib{width:72px;height:72px;border-radius:24px;margin:0 auto 14px;animation:fl 5s ease-in-out infinite}
.empty h3{font:600 22px Unbounded,sans-serif;margin-bottom:6px}
.empty p{color:var(--mute);font-size:14px;margin-bottom:16px}
.ex{display:block;width:100%;margin:6px 0;padding:11px 16px;border-radius:16px;background:var(--p1);border:1px solid var(--line);color:var(--mute);font-size:14px;text-align:left;transition:color .15s,border-color .15s}
.ex:hover{color:var(--ink);border-color:var(--c,var(--ac))}
.warn{display:flex;align-items:center;gap:10px;margin:0 0 8px;padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--gold);font-size:13px;text-align:left;width:100%;flex:none}
.opts{display:flex;gap:6px;overflow:auto;padding:2px 0 8px;scrollbar-width:none;flex:none}
.opts::-webkit-scrollbar{display:none}
.op{flex:none;padding:7px 14px;border-radius:12px;background:var(--p1);border:1px solid var(--line);color:var(--mute);font-size:13px;font-weight:500;transition:all .15s}
.op:hover{color:var(--ink)}
.op.on{background:var(--p3);border-color:var(--ink);color:var(--ink)}
.inp{flex:none;display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 18px;margin:0 0 14px;border-radius:26px;background:var(--p1);border:1px solid var(--line2);box-shadow:var(--shadow);transition:border-color .2s}
.inp:focus-within{border-color:var(--c,var(--ac))}
.inp textarea{flex:1;resize:none;max-height:140px;padding:10px 0;border:0;background:none;outline:0;line-height:1.45}
.inp textarea::placeholder{color:var(--dim)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--vio));color:#fff;display:grid;place-items:center;flex:none;transition:transform .12s,opacity .15s}
.send:active{transform:scale(.92)}.send:disabled{opacity:.4}

/* cards (profile + locked) */
.cards{display:grid;gap:12px}
.card{padding:20px;border-radius:24px;background:var(--p1);border:1px solid var(--line)}
.card h3{font-size:16px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.card>p{color:var(--mute);font-size:13px;margin-bottom:12px}
.who{position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;padding:22px;border-radius:26px;border:1px solid var(--line);background:
 radial-gradient(90% 140% at 100% 0%,rgba(155,107,255,.28),transparent 60%),radial-gradient(80% 120% at 0% 100%,rgba(106,122,255,.25),transparent 60%),var(--p1)}
.who .ava{width:64px;height:64px;border-radius:20px;font-size:26px}
.who h2{font:600 20px Unbounded,sans-serif;line-height:1.2}
.who p{color:var(--mute);font-size:13px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--p3);color:var(--mute)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.badge.ok i{background:var(--ok)}
.f{width:100%;margin:5px 0;padding:12px 14px;border-radius:14px;background:var(--p2);border:1px solid var(--line);outline:0;transition:border-color .15s}
.f:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.st{font-size:13px;margin-top:8px;min-height:18px}.st.ok{color:var(--ok)}.st.er{color:var(--err)}
.lockp{text-align:center;max-width:460px;margin:7vh auto 0;padding:10px}
.lockp>.ib{width:84px;height:84px;border-radius:28px;margin:0 auto 18px;animation:fl 5s ease-in-out infinite}
.lockp h3{font:600 24px Unbounded,sans-serif;margin-bottom:10px}
.lockp p{color:var(--mute);margin-bottom:20px}
.feat{display:grid;gap:8px;text-align:left;margin:0 0 22px}
.feat div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--p1);border:1px solid var(--line);font-size:14px}
.feat .ib{width:34px;height:34px;border-radius:11px;margin:0}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:flex-end}
.sheet.on{display:flex}
.sh{width:100%;max-width:560px;margin:0 auto;background:var(--p1);border:1px solid var(--line2);border-radius:28px 28px 0 0;padding:10px 12px calc(24px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1) both;max-height:86dvh;overflow:auto}
.sh .grab{display:block;width:42px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.sh h3{font:600 20px Unbounded,sans-serif;margin:0 6px 4px}
.sh>p{color:var(--mute);font-size:13px;margin:0 6px 10px}
.sh .si{padding:10px 12px;color:var(--ink)}.sh .si.on:before{display:none}
.sh .si b{display:block;font-weight:600}.sh .si small{color:var(--mute);font-weight:400;font-size:12px}
.sh .tk{margin-left:auto;color:var(--ink)}
@keyframes up{from{transform:translateY(70px);opacity:0}}

/* pwa */
.pwa{display:none;position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;z-index:50;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line2);border-radius:20px;padding:12px;align-items:center;gap:12px;box-shadow:var(--shadow);animation:up .3s ease both}
.pwa.on{display:flex}
.pwa img{width:42px;height:42px;border-radius:12px}
.pwa div{flex:1;font-size:12px;color:var(--mute)}.pwa b{display:block;color:var(--ink);font-size:14px}
.pwa .x{background:none;border:0;color:var(--mute);width:32px;height:32px}

.view{animation:vin .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.stg>*{animation:vin .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc((var(--i,0) + var(--b,0))*55ms)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero .pl{animation:fl 7s ease-in-out infinite}
.gear svg{transition:transform .5s cubic-bezier(.3,1.2,.5,1)}.gear:hover svg{transform:rotate(90deg)}
.gearf{display:none}
.spin svg{animation:spin .5s cubic-bezier(.3,1.2,.5,1)}@keyframes spin{from{transform:rotate(-120deg) scale(.5);opacity:0}}
.grp2{margin:18px 2px 8px;font-size:13px;font-weight:500;color:var(--dim)}
.list{border-radius:22px;background:var(--p1);border:1px solid var(--line);overflow:hidden}
.li{border-top:1px solid var(--line)}.li:first-child{border-top:0}
.lh{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left;color:var(--ink);transition:background .15s}
.lh:hover{background:var(--hov)}
.lh .t{flex:1;min-width:0}.lh .t b{display:block;font-weight:500;font-size:15px}.lh .t small{display:block;color:var(--mute);font-size:12px}
.lh .cv{color:var(--dim);transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
.li.open .lh .cv{transform:rotate(180deg)}

function addNotification(text, type = 'error') {
    const item = document.createElement('div');
    item.className = 'notif-item ' + (type === 'success' ? 'success' : '');
    const iconSvg = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>`;
    const ic = document.createElement('div'); ic.className = 'n-icon'; ic.innerHTML = iconSvg;
    const tx = document.createElement('div'); tx.className = 'n-text'; tx.textContent = text;
    item.append(ic, tx);

    const empty = notifList.querySelector('.notif-empty');
    if (empty) empty.remove();

    notifList.prepend(item);
    bellBadge.classList.add('show');

    if (notifList.children.length > 10) {
        notifList.lastElementChild.remove();
    }
}

function checkEmptyNotifs() {
    if (notifList.children.length === 0) {
        notifList.innerHTML = `<div class="notif-empty">У вас нет новых уведомлений</div>`;
    }
}

/* ===== ФОРМАТИРОВАНИЕ: текст из Telegram → код (Telegram HTML) ===== */
function tgFromNode(root){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const BLOCK=/^(DIV|P|LI|UL|OL|H[1-6]|TR)$/;
  const wrap=(t,tag,a)=>t.trim()?`<${tag}${a||''}>${t}</${tag}>`:t;
  function walk(n){
    if(n.nodeType===3)return esc(n.nodeValue.replace(/\u00a0/g,' ').replace(/[\u200b-\u200d\ufeff]/g,''));
    if(n.nodeType!==1)return '';
    const tag=n.nodeName;
    if(/^(SCRIPT|STYLE|META|HEAD|IFRAME|OBJECT)$/.test(tag))return '';
    if(tag==='BR')return '\n';
    let out=[...n.childNodes].map(walk).join('');
    const s=n.style||{},fw=String(s.fontWeight||''),td=(s.textDecorationLine||s.textDecoration||'');
    const bold=/^(B|STRONG)$/.test(tag)||fw==='bold'||+fw>=600;
    const ital=/^(I|EM)$/.test(tag)||s.fontStyle==='italic';
    const und=tag==='U'||/underline/.test(td);
    const strk=/^(S|STRIKE|DEL)$/.test(tag)||/line-through/.test(td);
    const mono=/^(CODE|TT)$/.test(tag)||/mono|consolas|courier/i.test(s.fontFamily||'');
    const spo=tag==='TG-SPOILER'||(n.classList&&n.classList.contains('spoiler'))||(n.dataset&&n.dataset.entityType==='MessageEntitySpoiler');
    if(tag==='PRE')out=wrap(out,'pre');
    else if(mono)out=wrap(out,'code');
    if(bold)out=wrap(out,'b');
    if(ital)out=wrap(out,'i');
    if(und)out=wrap(out,'u');
    if(strk)out=wrap(out,'s');
    if(spo)out=wrap(out,'tg-spoiler');
    if(tag==='A'){
      const hr=(n.getAttribute('href')||'').trim();
      if(/^(https?:|tg:|mailto:)/i.test(hr))out=wrap(out,'a',` href="${hr.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"`);
    }
    if(tag==='BLOCKQUOTE')out=wrap(out.trim(),'blockquote',n.hasAttribute('expandable')?' expandable':'');
    if((BLOCK.test(tag)||tag==='BLOCKQUOTE')&&out&&!out.endsWith('\n'))out+='\n';
    return out;
  }
  return walk(root).replace(/\n+$/,'');
}
const tgFromHtml=h=>tgFromNode(new DOMParser().parseFromString(h,'text/html').body);
const escTxt=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

        for(const it of items){
          if(it.types.includes('text/html')){
            const h=await(await it.getType('text/html')).text();
            ins(tgFromHtml(h));done=true;break;
          }
        }
      }
      if(!done){
        const t=await navigator.clipboard.readText();
        if(t){ins(escTxt(t));done=true}
      }

    }catch(e){

    function fallback(){

    }
  };

}

let tgs=null; // {name,title,count,analysis,type,sub,facts,html,err}
let tgPrem=localStorage.getItem('vagent_pe')!=='0';
const tgChannel=v=>{v=(v||'').trim();const m=v.match(/(?:t\.me\/(?:s\/)?|telegram\.me\/|^@)([A-Za-z][A-Za-z0-9_]{3,31})/i)||v.match(/^([A-Za-z][A-Za-z0-9_]{3,31})$/);return m?m[1]:''};
const noDef=x=>!x||/не определено/i.test(x);

/* --- очистка ответа ИИ до безопасного Telegram-HTML --- */
const TG_OK={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',INS:'u',S:'s',STRIKE:'s',DEL:'s',CODE:'code',PRE:'pre',BLOCKQUOTE:'blockquote','TG-SPOILER':'tg-spoiler'};
function tgClean(src){
 src=String(src||'').replace(/\r/g,'')
  .replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>')
  .replace(/(^|\n)((?:> ?[^\n]*)(?:\n> ?[^\n]*)*)/g,(m,a,b)=>a+'<blockquote>'+b.replace(/^> ?/gm,'')+'</blockquote>')
  .replace(/<\/blockquote>\n/g,'</blockquote>');
 const doc=new DOMParser().parseFromString('<body>'+src+'</body>','text/html');
 const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const walk=n=>{
  if(n.nodeType===3)return esc(n.nodeValue);
  if(n.nodeType!==1)return '';
  const tg=n.nodeName;
  if(/^(SCRIPT|STYLE|IFRAME|OBJECT)$/.test(tg))return '';
  if(tg==='BR')return '\n';
  const k=[...n.childNodes].map(walk).join('');
  if(tg==='BLOCKQUOTE'){const q=k.trim();return q?'<blockquote>'+q+'</blockquote>':''}
  if(TG_OK[tg])return k.trim()?`<${TG_OK[tg]}>${k}</${TG_OK[tg]}>`:k;
  if(tg==='A'){const h=(n.getAttribute('href')||'').trim();return /^https?:/i.test(h)?`<a href="${h.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${k}</a>`:k}
  if(/^(P|DIV|LI|H[1-6])$/.test(tg))return k.replace(/\n*$/,'')+'\n';
  return k;
 };
 return walk(doc.body).replace(/\n{3,}/g,'\n\n').trim();
}

/* --- «премиум»-эмодзи: анимированные картинки вместо обычных символов --- */
const PE_RE=/(\p{Extended_Pictographic}(?:[\uFE0F\u{1F3FB}-\u{1F3FF}]|\u200D\p{Extended_Pictographic})*\uFE0F?)/gu;
function peImg(ch){
 const cps=[...ch].map(c=>c.codePointAt(0));
 const c1=cps.map(x=>x.toString(16)).join('_'),c2=cps.filter(x=>x!==0xfe0f).map(x=>x.toString(16)).join('_');
 const list=[...new Set([c1,c2])];let i=0;
 const base='https://fonts.gstatic.com/s/e/notoemoji/latest/';
 const im=document.createElement('img');im.className='pe';im.alt=ch;im.src=base+list[0]+'/512.webp';
 im.onerror=()=>{i++;if(i<list.length)im.src=base+list[i]+'/512.webp';else im.replaceWith(document.createTextNode(ch))};
 return im;
}
function premiumize(root){
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{
  const parts=n.nodeValue.split(PE_RE);if(parts.length<2)return;
  const f=document.createDocumentFragment();
  parts.forEach((p,i)=>{if(!p)return;f.append(i%2?peImg(p):document.createTextNode(p))});
  n.replaceWith(f);
 });
}

/* --- факты: русская Википедия (работает из браузера, без сервера) --- */
async function wikiFacts(queries){
 const seen=new Set(),out=[];
 for(const q of queries.slice(0,4)){
  try{
   const u='https://ru.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=2&prop=extracts%7Cinfo&exintro=1&explaintext=1&exchars=900&inprop=url&gsrsearch='+encodeURIComponent(q);
   const r=await fetch(u);if(!r.ok)continue;
   const d=await r.json();
   const pages=Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index);
   const p=pages.find(x=>x.extract&&!seen.has(x.pageid));
   if(p){seen.add(p.pageid);out.push({title:p.title,url:p.fullurl,text:p.extract.trim().replace(/\n{2,}/g,'\n')})}
  }catch(e){}
 }
 return out.slice(0,4);
}

/* --- генерация оригинального поста только по найденным фактам --- */
async function tgGenerate(topic,avoid){
 const t=tgs;
 const wiki=t.facts.length?'ИЗ ВИКИПЕДИИ:\n'+t.facts.map((f,i)=>`[В${i+1}] ${f.title}: ${f.text}`).join('\n\n'):'';
 const web=t.web&&t.web.length?'ИЗ ИНТЕРНЕТА (новости и сайты):\n'+t.web.map((w,i)=>`[И${i+1}] ${w.title}${w.source?' — '+w.source:''}${w.date?' ('+w.date+')':''}${w.snippet?': '+w.snippet:''}`).join('\n'):'';
 const F=[wiki,web].filter(Boolean).join('\n\n')||'ФАКТОВ НЕ НАЙДЕНО.';
 const dir=[t.type,t.sub].filter(x=>!noDef(x)).join(' → ')||'не определено';
 const sys=`Ты автор Telegram-канала «${t.title||t.name}». Направление канала: ${dir}.
Задача: написать ОДИН новый оригинальный пост по теме.
ПРАВДИВОСТЬ (строго):
1. Конкретные факты (имена, названия, цифры, даты, версии, цены, события, цитаты) бери ТОЛЬКО из блока «ПРОВЕРЕННЫЕ ФАКТЫ» ниже.
2. Новости из интернета передавай как сообщение источника («по данным …», с датой) и только то, что есть в заголовке или описании. Детали не домысливай.
3. Ничего не выдумывай. Не придумывай обновления, рекорды, статистику. Если фактов мало или они не по теме — пиши общими формулировками без конкретики или задай вопрос аудитории. Лучше короче, чем с выдумкой.
ОРИГИНАЛЬНОСТЬ: не переписывай и не копируй ничего из описания канала, пиши свой текст по теме. Из описания канала бери только стиль: структуру, тон, длину, подачу, эмодзи — но не факты.
ОФОРМЛЕНИЕ как в Telegram (HTML-теги): заголовок в <b>…</b>; важное — <b>; акценты — <i>; главную мысль или факт оформи цитатой <blockquote>…</blockquote>; термины — <code>…</code>; 3–6 уместных эмодзи. Без Markdown, без пояснений — только текст поста.`;
 const usr=`Описание стиля канала (используй только оформление и тон):\n${t.analysis.slice(0,1200)}\n\nТема поста: ${topic||'выбери сам, опираясь на факты ниже'}\n\nПРОВЕРЕННЫЕ ФАКТЫ:\n${F}${avoid?`\n\nПрошлый вариант начинался так: «${avoid}». Не повторяй его, возьми другой ракурс.`:''}`;
 return tgClean(await chatAI([{role:'system',content:sys},{role:'user',content:usr}],1000));
}

                Там в блоке <b>Account Details</b> найди и скопируй свой <b>Account ID</b> (32 символа).
                (Или нажми CMD/CTRL+K и введи "Copy account ID").
            </li>
            <li>Вставь оба ключа в поля ниже и нажми «Сохранить и проверить».</li>
        </ol>
    </div>`;
 const keyBody=`<p style="color:var(--mute);font-size:13px;margin:4px 0 8px">Нужен для работы ИИ (текст и картинки). Хранится только в этом браузере.</p>
 ${cloudInstructions}
 <input class="f" id="tk" type="password" placeholder="API токен (cfut_…)" value="${k?'••••••••':''}" autocomplete="off"><input class="f" id="ac" placeholder="Account ID (32 символа или вся ссылка)" value="${k?k.account:''}" autocomplete="off">
 <div class="row"><button class="btn" onclick="saveKey()">Сохранить и проверить</button>${k?'<button class="btn g" onclick="delKey()">Удалить</button>':''}</div><div class="st" id="ks"></div>`;
 sc.append(grp('Нейросети',[acc('key','Ключ Cloudflare',k?'Подключён — ИИ работает':'Добавь ключ, чтобы ИИ заработал',`<span class="badge ${k?'ok':''}"><i></i>${k?'Подключён':'Не добавлен'}</span>`,keyBody,!k)]));
 const pwBody=`<input class="f" id="op" type="password" placeholder="Старый пароль" autocomplete="current-password"><input class="f" id="np" type="password" placeholder="Новый пароль (от 6 символов, буква + цифра + знак)" autocomplete="new-password"><div class="row"><button class="btn" onclick="chPass()">Сменить пароль</button></div><div class="st" id="ps"></div>`;
 sc.append(grp('Безопасность',[acc('shield','Сменить пароль','Введи старый и новый пароль','',pwBody,false)]));
 const total=Object.values(st.chats).reduce((n,a)=>n+(a?a.length:0),0);
 const [rc,bc]=row('trash','Очистить историю чатов',total?total+' сообщ. в этом браузере':'История пуста','','danger');
 bc.onclick=()=>{if(!total)return;if(!bc.dataset.sure){bc.dataset.sure=1;bc.querySelector('b').textContent='Нажми ещё раз для подтверждения';setTimeout(()=>{if(bc.isConnected){delete bc.dataset.sure;bc.querySelector('b').textContent='Очистить историю чатов'}},3000);return}st.chats={};save();draw()};
 sc.append(grp('Данные',[rc]));
 const [ra,ba]=row('info','О V-Agent','Чат с ИИ, картинки, идеи, шаблоны и хештеги. Автопостинг и видео — в приложении.',svg('arrow',16));
 ba.onclick=()=>{location.href='index.html#download'};ba.querySelector('.t small').style.whiteSpace='normal';
 const [rl,bl]=row('out','Выйти из аккаунта',USER,'');bl.onclick=logout;
 sc.append(grp('Приложение',[ra,rl]));
 [...sc.children].forEach((c,i)=>c.style.setProperty('--i',i));
 m.append(sc);$('#ava2').textContent=USER[0].toUpperCase();$('#nm2').textContent=USER;
}
async function saveKey(){
 const s=$('#ks');let tk=$('#tk').value.trim();const old=cf();if(tk.startsWith('•')&&old)tk=old.token;
 const a=($('#ac').value.match(/[a-f0-9]{32}/i)||[''])[0];
 if(tk.length<20||!a){s.className='st er';s.textContent='Проверь токен и Account ID';return}
 localStorage.setItem(CKEY,JSON.stringify({token:tk,account:a}));s.className='st';s.textContent='Проверяю…';
 try{await chatAI([{role:'user',content:'Ответь одним словом: привет'}],20);s.className='st ok';s.textContent='Ключ работает ✓';addNotification('Ключ Cloudflare успешно сохранен!', 'success')}catch(e){s.className='st er';s.textContent=e.message;addNotification('Ошибка ключа Cloudflare: ' + e.message, 'error')}
}
function delKey(){localStorage.removeItem(CKEY);draw()}
async function chPass(){
 const s=$('#ps'),o=$('#op').value,n=$('#np').value;if(!o||n.length<6||!/[A-Za-z]/.test(n)||!/[0-9]/.test(n)||!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?`~]/.test(n)){s.className='st er';s.textContent='Новый пароль: минимум 6 символов, английская буква, цифра и специальный знак';return}
 try{const r=await fetch(API+'/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:USER,old_password:o,new_password:n})});const d=await r.json();s.className='st '+(r.ok?'ok':'er');s.textContent=r.ok?'Пароль изменён ✓':(d.error||'Ошибка');if(r.ok)addNotification('Пароль успешно изменен!', 'success');else addNotification('Ошибка смены пароля: '+(d.error||''), 'error')}catch(e){s.className='st er';s.textContent='Нет связи с сервером'}
}
function logout(){localStorage.removeItem('vagent_user');location.href='web.html'}

/* === PWA УСТАНОВКА === */
let dp;
const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
const sa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

const showPwa = () => {
    if (!sa && !localStorage.getItem('pwa_dismissed') && innerWidth < 900) {
        setTimeout(() => $('#pwa').classList.add('on'), 2500);
    }
};

if (innerWidth < 900 && !localStorage.getItem('pwa_dismissed')) {
    if (ios) $('#pwab').textContent = 'Как?';
    showPwa();
}

addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    dp = e;
    if (!ios) showPwa();
});

$('#pwab').onclick = () => {
    if (ios) {
        alert('Нажми «Поделиться» внизу экрана → «На экран Домой» → «Добавить».');
    } else if (dp) {
        dp.prompt();
        dp = null;
    }
};

function closePwa() {
    $('#pwa').classList.remove('on');
    localStorage.setItem('pwa_dismissed', '1');
}

let wasDesk = isDesk();
addEventListener('resize', () => {
    if (isDesk() !== wasDesk) {
        wasDesk = isDesk();
        drawNav();
    }
});

drawNav();draw();
</script>
</body>
</html>
